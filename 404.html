<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Sean Legge</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#161310">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
  <style>
    :root
    {
      --color-ink: #161310;
      --color-ink-raised: #1f1a16;
      --color-ink-rule: #3a322c;
      --color-washi: #f3ede4;
      --color-washi-muted: #c9bdb0;
      --color-shu: #e24a3a;
      --color-shu-deep: #c43c2c;
      --color-gold: #c4a574;
      --font-display: "Shippori Mincho", "Times New Roman", serif;
      --font-body: "Source Sans 3", system-ui, sans-serif;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      --space-8: 4.5rem;
      --text-base: 1.0625rem;
      --text-lg: 1.25rem;
      --content-max: 40rem;
      --rule-accent: 2px;
      --focus-width: 2px;
      --focus-offset: 3px;
    }

    [data-bs-theme="dark"]
    {
      --bs-body-bg: var(--color-ink);
      --bs-body-color: var(--color-washi);
      --bs-link-color: var(--color-shu);
      --bs-link-hover-color: var(--color-washi);
    }

    body
    {
      margin: 0;
      min-height: 100vh;
      background: var(--color-ink);
      color: var(--color-washi);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.65;
    }

    main
    {
      width: min(100% - var(--space-6), var(--content-max));
      margin: 0 auto;
      padding: var(--space-8) var(--space-4);
    }

    h1
    {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: clamp(2.375rem, 7vw, 3.875rem);
      line-height: 1.18;
    }

    .kicker
    {
      color: var(--color-gold);
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .rule
    {
      display: block;
      width: 4.5rem;
      height: var(--rule-accent);
      margin: var(--space-5) 0;
      background: var(--color-shu-deep);
    }

    .muted
    {
      color: var(--color-washi-muted);
    }

    a
    {
      color: var(--color-shu);
    }

    a:hover
    {
      color: var(--color-washi);
    }

    :focus-visible
    {
      outline: var(--focus-width) solid var(--color-shu);
      outline-offset: var(--focus-offset);
    }

    .actions
    {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-4);
      margin-top: var(--space-6);
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Four oh four</p>
    <h1>This page is not here</h1>
    <span class="rule" aria-hidden="true"></span>
    <p class="muted">The address may be mistyped, or the page may have moved. The portfolio home is still the right place to start.</p>
    <p class="actions">
      <a id="home-link" href="/">Home</a>
      <a id="contact-link" href="/#contact">Contact</a>
    </p>
  </main>
  <script>
    /* GitHub Pages keeps the missing URL in the bar, so relative CSS would fail.
       Set this to "/your-repo/" on a project site. Leave "/" for a user site or custom domain. */
    const SITE_ROOT = "[[PLACEHOLDER: GitHub Pages root, / or /repo-name/]]";
    const root = SITE_ROOT.indexOf("PLACEHOLDER") === -1 ? SITE_ROOT : "/";
    const home_link = document.getElementById("home-link");
    const contact_link = document.getElementById("contact-link");

    if (home_link)
    {
        home_link.setAttribute("href", root);
    }

    if (contact_link)
    {
        contact_link.setAttribute("href", root + "#contact");
    }
  </script>
</body>
</html>
